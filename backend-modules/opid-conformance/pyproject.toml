[project]
name = "ocelescope-module-opid-conformance"
version = "0.1.0"
readme = "README.md"
description = "Object-centric conformance alignments for OPIDs, computed with oCoCoMoT"
authors = [{ name = "Sebastian Menne" }]
requires-python = ">=3.11"
dependencies = [
  "ocelescope-backend>=0.10.1,<0.11.0",
  "pydantic>=2.11",
  "python-multipart>=0.0.9",
  # oCoCoMoT (run from a checkout, see infrastructure/cocomot/checkout.py) needs the Yices
  # bindings and pyparsing. yices-solver bundles the native Yices library, but has no wheel
  # for Linux on ARM (e.g. Docker on Apple Silicon); there, install Yices system-wide.
  "pyparsing>=3.1",
  "yices>=1.1.6",
  "yices-solver>=2.6.5; sys_platform != 'linux' or platform_machine != 'aarch64'",
]

[dependency-groups]
dev = ["httpx>=0.27", "import-linter>=2.3", "pyright>=1.1.400", "pytest>=8", "ruff>=0.12"]

[project.entry-points."ocelescope_backend.modules"]
opidConformance = "ocelescope_module_opid_conformance.module:OPIDConformance"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
extend-exclude = ["*.md", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# The tests import their helpers (api.py, logs.py, conftest.py) by module name, as pytest runs them.
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"
# The runner imports oCoCoMoT from its checkout at run time.
ignore = ["src/ocelescope_module_opid_conformance/infrastructure/cocomot/runner.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The architecture, enforced (`pnpm run check:backend` at the repository root runs these).
# One hexagon with dependencies pointing inwards:
# module -> api -> infrastructure -> application -> domain.
[tool.importlinter]
root_package = "ocelescope_module_opid_conformance"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: module -> api -> infrastructure -> application -> domain"
type = "layers"
layers = [
  "ocelescope_module_opid_conformance.module",
  "ocelescope_module_opid_conformance.api",
  "(ocelescope_module_opid_conformance.infrastructure)",
  "ocelescope_module_opid_conformance.application",
  "ocelescope_module_opid_conformance.domain",
]

[[tool.importlinter.contracts]]
name = "Routes reach adapters only through the composition root (api/dependencies.py)"
type = "forbidden"
source_modules = ["ocelescope_module_opid_conformance.api.routes", "ocelescope_module_opid_conformance.api.router"]
forbidden_modules = ["ocelescope_module_opid_conformance.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application and domain know no web framework, host or solver"
type = "forbidden"
source_modules = ["ocelescope_module_opid_conformance.application", "ocelescope_module_opid_conformance.domain"]
forbidden_modules = ["fastapi", "ocelescope", "ocelescope_backend", "duckdb", "yices"]

[[tool.importlinter.contracts]]
name = "Domain has no dependency on application, including its ports"
type = "forbidden"
source_modules = ["ocelescope_module_opid_conformance.domain"]
forbidden_modules = ["ocelescope_module_opid_conformance.application"]
